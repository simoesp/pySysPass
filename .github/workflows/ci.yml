name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Least privilege: these jobs only read the repo to lint, test, and build.
permissions:
  contents: read

jobs:
  lint:
    name: Lint (ruff / PEP 8)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - run: pip install ruff==0.15.5
      - run: ruff check app/ tests/ scripts/ init_db.py

  backend-tests:
    name: Backend tests (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
      # Test exactly the hash-pinned set the container ships, plus test tools.
      - run: pip install --require-hashes -r requirements.lock
      - run: pip install -r requirements-dev.txt
      - run: python scripts/check-requirements-lock.py
      # Floor just under the measured 76% so coverage cannot silently regress.
      - run: python -m pytest tests/ -q --cov=app --cov-report=term --cov-fail-under=75

  frontend-build:
    name: Frontend tests + build (vitest / vite)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --legacy-peer-deps
        working-directory: frontend
      - run: npm run lint
        working-directory: frontend
      - run: npm test
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - name: Build frontend container
        run: docker build --tag syspass-frontend:ci frontend
      - name: Verify effective SPA security headers
        run: |
          docker run -d --name syspass-header-test --add-host backend:127.0.0.1 -p 127.0.0.1:18080:80 syspass-frontend:ci
          python scripts/check-security-headers.py http://127.0.0.1:18080
      - name: Remove header test container
        if: always()
        run: docker rm -f syspass-header-test || true

  security:
    name: Security scan (bandit / pip-audit / npm audit / gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - run: pip install bandit pip-audit
      # Python static security lint (medium+ severity).
      - run: bandit -r app/ -ll
      # Fail on known-vulnerable Python dependencies.
      - run: pip-audit -r requirements.txt
      # Audit the exact hash-pinned set the backend image installs.
      - run: pip-audit --disable-pip -r requirements.lock
      # Fail on known-vulnerable frontend dependencies.
      - run: npm audit --audit-level=high
        working-directory: frontend
      # Secrets scan across the full history (fetch-depth: 0 above), using
      # the repo's .gitleaks.toml allowlist for known sample/test data.
      - run: >-
          docker run --rm -v "${{ github.workspace }}:/repo"
          zricethezav/gitleaks:latest detect
          --source=/repo --config=/repo/.gitleaks.toml
          --gitleaks-ignore-path=/repo/.gitleaksignore --redact

  compat-php-reverse:
    name: PHP reads Python writes (sysPass 9d0e169)
    runs-on: ubuntu-latest
    env:
      SYSPASS_COMMIT: 9d0e169d2163897238877fb65130db47fe1ddcfa
      DEFUSE_COMMIT: f53396c2d34225064647a05ca76c1da9d99e5828  # v2.4.0
      PHP_IMAGE: docker.io/library/php:8.2-cli@sha256:2d72ff4b0cfe82e22f01f15223bc4ab4c825d318cb2e3275554cd32299a5ea50
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install --require-hashes -r requirements.lock
      - run: pip install -r requirements-dev.txt
      - name: Fetch pinned upstream sysPass and Defuse sources
        run: |
          for spec in "syspass https://github.com/nuxsmin/sysPass.git $SYSPASS_COMMIT" \
                      "defuse https://github.com/defuse/php-encryption.git $DEFUSE_COMMIT"; do
            set -- $spec
            git init -q "/tmp/upstream/$1"
            git -C "/tmp/upstream/$1" fetch -q --depth 1 "$2" "$3"
            git -C "/tmp/upstream/$1" checkout -q FETCH_HEAD
          done
      # Fails if sysPass PHP cannot decrypt account credentials or open public
      # links written by pySysPass (API, copy, CSV/KeePass/XML import, links).
      - name: Decode pySysPass writes with upstream PHP
        env:
          PYSYSPASS_PHP_VERIFY_CMD: >-
            docker run --rm -i -v /tmp/upstream:/upstream:ro -v ${{ github.workspace }}/scripts:/scripts:ro
            ${{ env.PHP_IMAGE }} php /scripts/verify-python-writes.php /upstream/syspass /upstream/defuse
        run: python -m pytest -q -rs tests/compatibility/test_php_reverse_roundtrip.py

  compat-mysql:
    name: Schema bootstrap on MySQL 8 (PHP compatibility)
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: syspass
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=10s --health-timeout=5s --health-retries=10
    env:
      DATABASE_URL: "mysql+pymysql://root:root@127.0.0.1:3306/syspass"
      SQLALCHEMY_SCHEMA_GUARD: "false"
      SECRET_KEY: ci-secret
      ENCRYPTION_KEY: ci-encryption-key-32-bytes-long!!
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install --require-hashes -r requirements.lock
      - run: pip install -r requirements-dev.txt
      # Create the full PHP-compatible schema on a real MySQL 8 instance.
      - run: python init_db.py
      # Assert the expected physical tables were created.
      - run: |
          python - <<'PY'
          from sqlalchemy import create_engine, text
          import os
          e = create_engine(os.environ["DATABASE_URL"])
          with e.connect() as c:
              n = c.execute(text(
                  "SELECT COUNT(*) FROM information_schema.tables "
                  "WHERE table_schema = 'syspass' AND table_type = 'BASE TABLE'"
              )).scalar()
          print(f"physical tables created: {n}")
          assert n == 27, f"expected 27 physical PHP tables, got {n}"
          from sqlalchemy import inspect
          from app.db.bootstrap import bootstrap_database
          assert set(inspect(e).get_view_names()) == {"account_data_v", "account_search_v"}
          with e.connect() as c:
              for view in ("account_data_v", "account_search_v"):
                  c.execute(text(f"SELECT * FROM {view} LIMIT 0"))
          assert bootstrap_database(e) is False, "bootstrap must be idempotent"
          PY
      # API/import behavior that SQLite cannot prove (NOT NULL FKs, strict
      # column limits). Uses its own disposable database on this server.
      - name: Canonical MySQL account, import, and readiness tests
        env:
          PYSYSPASS_MYSQL_TEST_URL: "mysql+pymysql://root:root@127.0.0.1:3306/"
        run: python -m pytest -q -rs tests/test_mysql_account_references.py tests/test_mysql_readiness.py
      - name: Build recovery container
        run: docker build -t pysyspass-recovery:ci .
      - name: Rehearse database and mounted runtime recovery
        run: |
          docker volume create recovery-ci-data
          docker run --rm --network host \
            -v recovery-ci-data:/app/data \
            -v "$PWD/scripts:/app/scripts:ro" \
            -e DATABASE_URL -e SQLALCHEMY_SCHEMA_GUARD -e DEBUG=false \
            -e ALLOW_DISPOSABLE_RECOVERY_TEST=yes -e PYTHONPATH=/app \
            pysyspass-recovery:ci python scripts/check-backup-recovery.py
      # The runtime image must stay non-root and free of local state/tooling.
      - name: Verify hardened backend image
        run: |
          test "$(docker run --rm pysyspass-recovery:ci id -u)" = 10001
          docker run --rm pysyspass-recovery:ci sh -c \
            '! python -c "import pytest" 2>/dev/null && ! command -v gcc && test ! -e /app/tests && test ! -e /app/config/runtime-config.json && ! touch /app/app/probe 2>/dev/null'
      - name: Remove recovery volume
        if: always()
        run: docker volume rm recovery-ci-data || true
