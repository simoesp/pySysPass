version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      python-deps:
        patterns: ["*"]

  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "weekly"
    groups:
      frontend-deps:
        patterns: ["*"]

  # Base images are pinned by digest; let Dependabot propose digest updates.
  - package-ecosystem: "docker"
    directories: ["/", "/frontend"]
    schedule:
      interval: "weekly"
    groups:
      container-images:
        patterns: ["*"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
